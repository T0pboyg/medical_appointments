name: Browser tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run isolated browser journey
        run: docker compose -p medical-appointments-e2e -f compose.e2e.yaml up --build --abort-on-container-exit --exit-code-from runner
      - name: Upload synthetic failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop isolated test environment
        if: always()
        run: docker compose -p medical-appointments-e2e -f compose.e2e.yaml down --remove-orphans
