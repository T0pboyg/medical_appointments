<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Διαχείριση Ραντεβού</title>

    <!-- Εισαγωγή γραμματοσειράς Inter από το Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script type="module" src="/main.jsx"></script>
</head>

<body>
    <div id="root"></div>
    <div class="app-container">


        <main>
            <!-- Φόρμα δημιουργίας ραντεβού -->
            <section class="card" aria-labelledby="create-heading">

                <form id="appointment-form">
                    <div class="form-group">
                        <label>Επιλογή Ημέρας & Ώρας</label>

                        <!-- Hidden input για να αποθηκεύεται η επιλεγμένη ημερομηνία -->
                        <input type="hidden" id="selected-date" name="selected_date" required>

                        <!-- Επιλογή Ώρας (εμφανίζεται αφού επιλεγεί μέρα) -->
                        <div id="time-selection-wrapper" class="time-wrapper" style="display: none;">
                            <label for="time-slot">Διαθέσιμες Ώρες για την επιλεγμένη μέρα:</label>
                            <select id="time-slot" name="time_slot" required>
                                <option value="">-- Επιλέξτε ώρα --</option>
                                <!-- Οι ώρες γεμίζουν δυναμικά -->
                            </select>
                        </div>
                    </div>

                </form>
            </section>


        </main>
    </div>
</body>

</html>
